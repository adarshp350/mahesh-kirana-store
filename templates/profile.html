
{% extends 'base.html' %}

{% block title %}My Profile | Mahesh Kirana Store{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow p-4">

                <div class="text-center mb-4">

                    <div style="font-size: 65px;">👤</div>

                    <h3 class="fw-bold text-success">
                        My Profile
                    </h3>

                    <p class="text-muted">
                        Your account information
                    </p>

                </div>

                <hr>

                <div class="mb-3">
                    <label class="form-label text-muted">Customer Name</label>
                    <input type="text"
                           class="form-control"
                           value="{{ request.user.first_name }}"
                           readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Username</label>
                    <input type="text"
                           class="form-control"
                           value="{{ request.user.username }}"
                           readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Mobile Number</label>
                    <input type="text"
                           class="form-control"
                           value="{{ customer.phone|default:'Not added' }}"
                           readonly>
                </div>

                <hr>

                <div class="d-grid gap-2">

                    <a href="{% url 'my_orders' %}"
                       class="btn btn-success">
                        📦 My Orders
                    </a>

                    <a href="{% url 'home' %}"
                       class="btn btn-outline-secondary">
                        Continue Shopping
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
